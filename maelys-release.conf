# What maelys-sandbox-policy declares to the maelys-release socle.

[cut]
# The public header carries the version as MAELYS_SANDBOX_POLICY_VERSION, which
# package-release.sh and the installed pkg-config file must agree with.
after-version sh scripts/sync-version.sh

[dependencies]
# maelys-cli (the command-line framework) and agent-cli-spec (whose
# conformance kit drives maelys-policy) are read under
# $MAELYS_DEPENDENCIES_DIR, never from a working copy beside this one.
apart
