name: release

# Managed by maelys-release v0.61.0 (0.61.0). Regenerate with
# 'maelys-release adopt' of maelys-release; do not edit by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag whose release and Homebrew publication are replayed
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: maelys-dev/maelys-release/.github/workflows/release.yml@75351e9343016d50f2140a46d664987902726c71 # v0.61.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-sandbox-policy
      tag: ${{ inputs.tag || github.ref_name }}
      dependency_checkout: |
        sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      linux_packages: build-essential dpkg-dev file rpm python3

  tap-maelys-sandbox-policy:
    needs: release
    if: needs.release.result == 'success'
    uses: maelys-dev/maelys-release/.github/workflows/tap.yml@75351e9343016d50f2140a46d664987902726c71 # v0.61.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      product: maelys-sandbox-policy
      tag: ${{ inputs.tag || github.ref_name }}
      render_command: sh scripts/render-homebrew-formula.sh TAG OUTPUT maelys-sandbox-policy
      bottles: '["macos-15","macos-26"]'
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      tap_signing_key: ${{ secrets.HOMEBREW_TAP_SIGNING_KEY }}
