name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-policy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The socle's product CI: `make check` on the three release targets, the
  # sanitizers and the fuzz smoke run on Linux with clang, and the socle drift
  # check, which regenerates docs/cli.md. The jobs below cover what it does
  # not: other compilers and runners, WASM/TypeScript conformance, Docker and
  # package contents.
  socle:
    uses: maelys-dev/maelys-release/.github/workflows/check-product.yml@5148671abf3a1b437025881d10fd768efb9de5b3 # v0.62.2
    with:
      product: maelys-sandbox-policy
      sanitizer_command: make asan && make ubsan && make tsan
      fuzz_command: make fuzz

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang
          - os: macos-26
            cc: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # One root for every pin, exported for this job: the build reads
      # $MAELYS_DEPENDENCIES_DIR and nothing beside the repository.
      - run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      - if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - run: make check CC=${{ matrix.cc }}

  portable-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # One root for every pin, exported for this job: the build reads
      # $MAELYS_DEPENDENCIES_DIR and nothing beside the repository.
      - run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      - run: |
          # A broken third-party apt source of the runner image must not fail an
          # install of Ubuntu archive packages: the update reports, the install decides.
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install --yes emscripten nodejs npm
      - run: make playground-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playground-dist
          path: dist/playground/
          if-no-files-found: error

  docker-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # One root for every pin, exported for this job: the build reads
      # $MAELYS_DEPENDENCIES_DIR and nothing beside the repository.
      - run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      - run: scripts/test-docker.sh

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # One root for every pin, exported for this job: the build reads
      # $MAELYS_DEPENDENCIES_DIR and nothing beside the repository.
      - run: sh scripts/checkout-dependencies.sh "$RUNNER_TEMP/dependencies" >>"$GITHUB_ENV"
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || echo "::warning::apt-get update reported errors; the install decides"
          sudo apt-get install --yes build-essential dpkg-dev rpm
      - run: bash scripts/package-release.sh ${{ matrix.target }}
      - name: Verify package contents
        shell: bash
        run: |
          tar tzf "dist/maelys-sandbox-policy-$(cat VERSION)-${{ matrix.target }}.tar.gz" >package-contents.txt
          grep -q 'usr/local/bin/maelys-policy' package-contents.txt
          grep -q 'usr/local/include/maelys/sandbox_policy.h' package-contents.txt
